[project]
name = "ogx-demos"
version = "0.1.0"
description = "ogx-demos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel==7.0.0a0",
    "ogx-client>=1.0.2",
    "pre-commit>=4.2.0",
    "python-dotenv>=1.1.0",
    "streamlit>=1.44.1",
    "geocoder>=1.38.1",
    "ogx[starter,client]>=1.0.0",
    "scipy>=1.15.2",
    "matplotlib>=3.10.3",
    "openai>=1.75.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.31",
    "yfinance>=0.2.0",
    "trafilatura>=2.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "demos/rag_eval",
    "tests/eval_tests",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line length — handled by the formatter
    "SIM108", # ternary operator — often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["demos"]
